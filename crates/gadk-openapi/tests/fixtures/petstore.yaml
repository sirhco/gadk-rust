openapi: 3.0.3
info:
  title: Pet Store
  version: 1.0.0
servers:
  - url: https://{region}.pets.example.com/api/v3
    variables:
      region:
        default: eu
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      description: Returns every pet, newest first.
      parameters:
        - name: limit
          in: query
          description: How many pets to return.
          schema:
            type: integer
        - name: tag
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        200:
          description: The pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        $ref: '#/components/requestBodies/NewPet'
      responses:
        201:
          description: Created.
  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      operationId: getPet
      parameters:
        - name: X-Request-Id
          in: header
          schema:
            type: string
      responses:
        200:
          description: The pet.
        404:
          description: Not found.
    delete:
      operationId: deletePet
      description: Deletes a pet for good.
      responses:
        204:
          description: Deleted.
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: The pet's id.
      schema:
        type: string
  requestBodies:
    NewPet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Rex
        tag:
          type: string
          nullable: true
      xml:
        name: pet
