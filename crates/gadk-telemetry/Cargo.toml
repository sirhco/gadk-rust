[package]
name = "gadk-telemetry"
description = "OpenTelemetry tracing, metrics and logs for gadk, with Google Cloud export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
gadk-engine = { workspace = true }
gadk-model = { workspace = true, features = ["gcp-auth"] }
gadk-platform = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-http = { workspace = true }
google-cloud-auth = { workspace = true }
reqwest = { workspace = true }
http = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
gadk-engine = { workspace = true, features = ["testutil"] }
gadk-server = { workspace = true }
gadk-agent = { workspace = true }
gadk-genai = { workspace = true }
gadk-session = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
rstest = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
