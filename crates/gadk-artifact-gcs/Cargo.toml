[package]
name = "gadk-artifact-gcs"
description = "Google Cloud Storage artifact service for gadk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
# Test hooks: the in-memory `FakeBucket`, `GcsArtifactService::with_bucket_for_testing`, and the
# `testutil` module's helpers for reading requests recorded by gadk-model's fake HTTP server.
testutil = ["gadk-model/test-util", "dep:parking_lot"]

[dependencies]
gadk-artifact = { workspace = true }
gadk-genai = { workspace = true }
gadk-model = { workspace = true, features = ["gcp-auth"] }
gadk-platform = { workspace = true }
google-cloud-auth = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
gadk-artifact-gcs = { path = ".", features = ["testutil"] }
gadk-artifact = { workspace = true, features = ["testsuite"] }
gadk-model = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
pretty_assertions = { workspace = true }
parking_lot = { workspace = true }
