[package]
name = "gadk-session-database"
description = "SQL database session service for gadk (SQLite and PostgreSQL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = ["sqlite"]
# sqlite through sqlx's bundled libsqlite3.
sqlite = ["sqlx/sqlite"]
# PostgreSQL; TLS through rustls with the aws-lc-rs provider the workspace already uses.
postgres = ["sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs"]
# Test hooks: `DatabaseSessionService::with_statement_log`.
testutil = []

[dependencies]
gadk-session = { workspace = true }
gadk-model = { workspace = true }
gadk-platform = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
gadk-session-database = { path = ".", default-features = false, features = ["testutil"] }
gadk-session = { workspace = true, features = ["testsuite"] }
gadk-genai = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
