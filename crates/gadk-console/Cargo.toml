[package]
name = "gadk-console"
description = "A local web console for gadk traces and prompts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lints]
workspace = true

[[bin]]
name = "gadk-console"
path = "src/main.rs"

[dependencies]
gadk-analytics = { workspace = true }
gadk-model = { workspace = true }
gadk-bigquery = { workspace = true }
gadk-cloudtrace = { workspace = true }
gadk-eval = { workspace = true }
gadk-eval-monitor = { workspace = true }
gadk-prompts = { workspace = true }
gadk-prompts-cli = { workspace = true, features = ["firestore"] }
async-trait = { workspace = true }
axum = { workspace = true, features = ["form"] }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
http = { workspace = true }
maud = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
similar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# `gadk_analytics::testutil`: the fake HTTP client and row fixtures of the query tests.
gadk-analytics = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
gadk-telemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
