[package]
name = "gadk-console"
description = "A local web console for gadk traces and prompts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "gadk-console"
path = "src/main.rs"

[dependencies]
gadk-model = { workspace = true, features = ["gcp-auth"] }
gadk-prompts = { workspace = true }
gadk-prompts-cli = { workspace = true, features = ["firestore"] }
async-trait = { workspace = true }
axum = { workspace = true, features = ["form"] }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# Names `google_cloud_auth::credentials::Credentials` (the lazily built ADC).
google-cloud-auth = { workspace = true }
http = { workspace = true }
maud = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Builds the fake HTTP client's `BodyStream` in the cloud.rs tests.
futures = { workspace = true }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
gadk-telemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
