[package]
name = "gadk-eval"
description = "Offline evaluation of gadk agents: eval sets, scorers and an LLM judge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
gadk-agent = { workspace = true }
gadk-engine = { workspace = true }
gadk-genai = { workspace = true }
gadk-model = { workspace = true }
gadk-platform = { workspace = true }
gadk-prompts = { workspace = true }
gadk-session = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
gadk-engine = { workspace = true, features = ["testutil"] }
gadk-gemini = { workspace = true }
schemars = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
