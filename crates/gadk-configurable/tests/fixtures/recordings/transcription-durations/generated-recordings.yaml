recordings:
    - user_message_index: 0
      agent_name: root_agent
      llm_recording:
        llm_request:
            model: gemini-2.5-flash
            contents:
                - parts:
                    - text: Hi
                  role: user
        llm_responses:
            - input_transcription:
                text: hello
                startoffset: 0s
                endoffset: 0s
              output_transcription:
                text: hi there
                finished: true
                startoffset: 1.5s
                endoffset: 1m30s
            - output_transcription:
                text: x
                startoffset: 0s
                endoffset: 1h0m0s
