recordings:
    - user_message_index: 0
      agent_name: tools_agent
      llm_recording:
        llm_request:
            model: gemini-2.5-flash
            contents:
                - parts:
                    - text: Hi
                  role: user
            config:
                tools:
                    - function_declarations:
                        - description: |-
                            Creates a booking for a user.

                            Args:
                              user_id: The unique identifier for the user.
                              is_confirmed: Whether the booking is confirmed.
                              details: Any additional details for the booking.

                            Returns:
                              A dictionary containing the booking information and the types of the
                              received arguments.
                          name: create_booking
                          parameters_json_schema:
                            title: "create_bookingParams"
                            type: object
                            required:
                                - user_id
                                - is_confirmed
                                - details
                            properties:
                                details:
                                    title: "Details"
                                    type: string
                                is_confirmed:
                                    title: "Is Confirmed"
                                    type: boolean
                                user_id:
                                    title: "User Id"
                                    type: integer
        llm_responses:
            - content:
                parts:
                    - text: done
                role: model
