recordings:
    - user_message_index: 0
      agent_name: root_agent
      llm_recording:
        llm_request:
            model: gemini-2.5-flash
            contents:
                - parts:
                    - text: Hi
                  role: user
            config:
                system_instruction: |
                    You are a helpful agent.
                    Answer briefly.
        llm_responses:
            - content:
                parts:
                    - text: OK
                role: model
    - user_message_index: 0
      agent_name: single_line
      llm_recording:
        llm_request:
            model: gemini-2.5-flash
            contents:
                - parts:
                    - text: Hi
                  role: user
            config:
                system_instruction: 'One line: with a colon'
        llm_responses:
            - content:
                parts:
                    - text: OK
                role: model
    - user_message_index: 0
      agent_name: no_text
      llm_recording:
        llm_request:
            model: gemini-2.5-flash
            contents:
                - parts:
                    - text: Hi
                  role: user
        llm_responses:
            - content:
                parts:
                    - text: OK
                role: model
