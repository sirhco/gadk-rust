recordings:
    - user_message_index: 0
      agent_name: tools_agent
      llm_recording:
        llm_request:
            model: gemini-2.5-flash
            contents:
                - parts:
                    - text: Hi
                  role: user
            config:
                system_instruction: |-
                    Use the tools.

                    You are an agent. Your internal name is "tools_agent".
                tools:
                    - function_declarations:
                        - description: Checks if the provided string is a valid email format.
                          name: validate_email
                          parameters_json_schema:
                            title: "validate_emailParams"
                            type: object
                            required:
                                - email
                            properties:
                                email:
                                    title: "Email"
                                    type: string
                        - description: Retrieves a user ID based on their email.
                          name: get_user_id
                          parameters_json_schema:
                            title: "get_user_idParams"
                            type: object
                            required:
                                - email
                            properties:
                                email:
                                    title: "Email"
                                    type: string
                        - description: |-
                            Creates a booking for a user.

                            Args:
                              user_id: The unique identifier for the user.
                              is_confirmed: Whether the booking is confirmed.
                              details: Any additional details for the booking.

                            Returns:
                              A dictionary containing the booking information and the types of the
                              received arguments.
                          name: create_booking
                          parameters_json_schema:
                            title: "create_bookingParams"
                            type: object
                            required:
                                - user_id
                                - is_confirmed
                                - details
                            properties:
                                details:
                                    title: "Details"
                                    type: string
                                is_confirmed:
                                    title: "Is Confirmed"
                                    type: boolean
                                user_id:
                                    title: "User Id"
                                    type: integer
                        - description: |
                            Search for flights based on trip details and preferences.

                            This function demonstrates advanced parameter handling:
                            - Pydantic models as parameters (trip, preferences)
                            - Optional/nullable parameters (preferences, return_date, preferred_airline)
                            - Default values (cabin_class, max_stops, flexible_dates)

                            Args:
                              trip: Core trip information including origin, destination, and dates.
                              preferences: Optional flight preferences. If not provided, uses defaults.

                            Returns:
                              A dictionary containing search results and parameters received.
                          name: search_flights
                          parameters_json_schema:
                            title: "search_flightsParams"
                            type: object
                            required:
                                - trip
                                - preferences
                            properties:
                                preferences:
                                    title: "Preferences"
                                    types:
                                        - "null"
                                        - object
                                    required:
                                        - cabin_class
                                        - max_stops
                                        - preferred_airline
                                        - flexible_dates
                                    properties:
                                        cabin_class:
                                            type: string
                                        flexible_dates:
                                            type: boolean
                                        max_stops:
                                            type: integer
                                        preferred_airline:
                                            types:
                                                - "null"
                                                - string
                                trip:
                                    title: "Trip"
                                    type: object
                                    required:
                                        - origin
                                        - destination
                                        - departure_date
                                        - return_date
                                    properties:
                                        departure_date:
                                            type: string
                                        destination:
                                            type: string
                                        origin:
                                            type: string
                                        return_date:
                                            type: string
                        - description: |
                            Calculate total trip cost with various optional charges.

                            This function demonstrates:
                            - Mix of required and optional parameters
                            - Default values for common cases
                            - Nullable parameter that affects calculation logic

                            Args:
                              base_fare: Base ticket price per passenger.
                              num_passengers: Number of passengers (default: 1).
                              insurance: Whether to add travel insurance (default: False).
                              baggage_count: Number of checked bags per passenger, or None for carry-on
                                only.

                            Returns:
                              A dictionary with cost breakdown.
                          name: calculate_trip_cost
                          parameters_json_schema:
                            title: "calculate_trip_costParams"
                            type: object
                            required:
                                - base_fare
                                - num_passengers
                                - insurance
                                - baggage_count
                            properties:
                                baggage_count:
                                    title: "Baggage Count"
                                    types:
                                        - "null"
                                        - integer
                                base_fare:
                                    title: "Base Fare"
                                    type: number
                                insurance:
                                    title: "Insurance"
                                    type: boolean
                                num_passengers:
                                    title: "Num Passengers"
                                    type: integer
                        - description: Reimburse the amount of money to the employee.
                          name: reimburse
                          parameters_json_schema:
                            title: "reimburseParams"
                            type: object
                            required:
                                - purpose
                                - amount
                            properties:
                                amount:
                                    title: "Amount"
                                    type: number
                                purpose:
                                    title: "Purpose"
                                    type: string
                        - description: |-
                            Ask for approval for the reimbursement.

                            NOTE: This is a long-running operation. Do not call this tool again if it has already returned some intermediate or pending status.
                          name: ask_for_approval
                          parameters_json_schema:
                            title: "ask_for_approvalParams"
                            type: object
                            required:
                                - purpose
                                - amount
                            properties:
                                amount:
                                    title: "Amount"
                                    type: number
                                purpose:
                                    title: "Purpose"
                                    type: string
        llm_responses:
            - content:
                parts:
                    - text: done
                role: model
