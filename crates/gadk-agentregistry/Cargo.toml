[package]
name = "gadk-agentregistry"
description = "Client for the Google Cloud Agent Registry (A2A agents, MCP servers and models) for gadk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = ["a2a", "mcp"]
# `Client::remote_agent`: a registered A2A agent as a gadk remote agent (gadk-a2a's client).
a2a = ["dep:gadk-a2a"]
# `Client::mcp_toolset`: a registered MCP server as a gadk-mcp toolset.
mcp = ["dep:gadk-mcp"]

[dependencies]
gadk-agent = { workspace = true }
gadk-auth = { workspace = true }
gadk-platform = { workspace = true }
gadk-a2a = { workspace = true, optional = true, features = ["client"] }
gadk-mcp = { workspace = true, optional = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
gadk-engine = { workspace = true, features = ["testutil"] }
gadk-session = { workspace = true }
gadk-genai = { workspace = true }
gadk-model = { workspace = true }
gadk-a2a = { workspace = true, features = ["server", "client", "testutil"] }
gadk-mcp = { workspace = true, features = ["testutil"] }
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
