[package]
name = "gadk-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `rest::test_util`: the scripted fake `HttpClient` and the 127.0.0.1 fake server shared by the
# provider crates' tests.
test-util = ["dep:hyper", "dep:hyper-util"]
# `gcp_auth`: Google Application Default Credentials (google-cloud-auth), shared by the Google
# Cloud clients (gadk-anthropic on Vertex AI, gadk-artifact-gcs).
gcp-auth = ["dep:google-cloud-auth"]

[dependencies]
gadk-genai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
google-cloud-auth = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["server", "http1"] }
hyper-util = { workspace = true, optional = true, features = ["tokio", "service"] }

[dev-dependencies]
gadk-model = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
