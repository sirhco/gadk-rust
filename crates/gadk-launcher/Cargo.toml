[package]
name = "gadk-launcher"
description = "Run a gadk agent from the command line: console, REST web server, A2A and web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = ["full"]
# The web server with the ADK REST API sub-launcher (`api`).
web = [
  "dep:gadk-server",
  "dep:axum",
  "dep:hyper",
  "dep:hyper-util",
  "dep:tower",
  "dep:http",
  "dep:bytes",
  "dep:url",
]
# The A2A sub-launcher, served through gadk-a2a's executor.
a2a = ["web", "dep:gadk-a2a"]
# The embedded ADK web UI sub-launcher.
webui = ["web", "dep:regex"]
# The Pub/Sub and Eventarc trigger sub-launchers.
triggers = ["web"]
# The Agent Engine sub-launcher and `agentengine::new_launcher`; not in `prod` or `full`.
agentengine = ["web", "gadk-server/agentengine"]
# The `prod` preset: web(api, a2a).
prod = ["web", "a2a"]
# The `full` preset: console, web(webui, a2a, pubsub, eventarc, api).
full = ["web", "a2a", "webui", "triggers"]

[dependencies]
gadk-agent = { workspace = true }
gadk-engine = { workspace = true }
gadk-session = { workspace = true }
gadk-artifact = { workspace = true }
gadk-memory = { workspace = true }
gadk-genai = { workspace = true }
gadk-model = { workspace = true }
gadk-platform = { workspace = true }
# The launcher always links telemetry.
gadk-telemetry = { workspace = true }
gadk-server = { workspace = true, optional = true }
gadk-a2a = { workspace = true, optional = true, features = ["server", "client"] }
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, optional = true, features = ["server", "server-auto", "http1", "http2", "tokio", "service"] }
tower = { workspace = true, optional = true, features = ["util"] }
http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
url = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
gadk-engine = { workspace = true, features = ["testutil"] }
gadk-server = { workspace = true, features = ["testutil"] }
gadk-a2a = { workspace = true, features = ["server", "client", "testutil"] }
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
# The telemetry tests implement span processors, build a conflicting resource and read spans
# back from an in-memory exporter.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
