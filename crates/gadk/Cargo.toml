[package]
name = "gadk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Examples are declared explicitly below: examples/toolsearch_catalog.rs is a module shared
# with tests/examples_toolsearch_main.rs through #[path], not an example.
autoexamples = false

[lints]
workspace = true

[features]
default = ["gemini", "gcp", "mcp"]
gemini = ["dep:gadk-gemini"]
gcp = ["gadk-auth/gcp"]
mcp = ["dep:gadk-mcp"]
# Claude models (gadk-anthropic); not in `default`.
anthropic = ["dep:gadk-anthropic"]
# OpenAI models (gadk-openai); not in `default`.
openai = ["dep:gadk-openai"]
# Relational-database sessions (gadk-session-database; sqlite by default — enable the crate's
# `postgres` feature in your own manifest for PostgreSQL); not in `default`.
database = ["dep:gadk-session-database"]
# Artifacts in Google Cloud Storage (gadk-artifact-gcs); not in `default`.
gcs = ["dep:gadk-artifact-gcs"]
# Sessions and memory in a Vertex AI Agent Engine (gadk-vertexai); not in `default`.
vertexai = ["dep:gadk-vertexai"]
# The ADK REST API server with inbound authn/authz (gadk-server); not in `default`.
# With `a2a` it also enables `gadk::a2a::server::caller_user` (gadk-a2a feature `gadk-server`).
server = ["dep:gadk-server", "gadk-a2a?/gadk-server"]
# The Agent2Agent protocol: serve agents over A2A and use remote A2A agents (gadk-a2a); not in
# `default`.
a2a = ["dep:gadk-a2a"]
# The ADK-Go launcher: console and web (REST API, A2A, web UI, triggers) sub-launchers
# (gadk-launcher with its `full` and `prod` presets); not in `default`. `full` comes from
# gadk-launcher's default features, which the dependency below keeps; `full` does not enable
# the `prod` feature, so it is named here to expose `gadk::launcher::prod`.
launcher = ["dep:gadk-launcher", "gadk-launcher/prod", "telemetry"]
# The Agent Engine server (`gadk_server::agentengine`) and its launcher
# (`agentengine::new_launcher`, Go `cmd/launcher/agentengine`); not in `default`.
agentengine = ["launcher", "dep:gadk-server", "gadk-launcher/agentengine", "gadk-server/agentengine"]
# OpenTelemetry export (gadk-telemetry, Go's `telemetry` package): tracer and logger providers,
# OTLP/HTTP and GCP export, the GCP resource detector and the `tracing` bridge layer; not in
# `default` (`launcher` enables it, as Go's launcher always links telemetry).
telemetry = ["dep:gadk-telemetry"]
# The Agent Registry client (gadk-agentregistry: registered A2A agents and MCP servers); not in
# `default`.
agentregistry = ["dep:gadk-agentregistry"]

[dependencies]
gadk-genai = { workspace = true }
gadk-platform = { workspace = true }
gadk-model = { workspace = true }
gadk-session = { workspace = true }
gadk-gemini = { workspace = true, optional = true }
gadk-artifact = { workspace = true }
gadk-artifact-gcs = { workspace = true, optional = true }
gadk-memory = { workspace = true }
gadk-agent = { workspace = true }
gadk-engine = { workspace = true }
gadk-tools = { workspace = true }
# The root pin has default-features = false, so `gcp` is the façade's choice.
gadk-auth = { workspace = true }
gadk-mcp = { workspace = true, optional = true }
gadk-anthropic = { workspace = true, optional = true }
gadk-openai = { workspace = true, optional = true }
gadk-session-database = { workspace = true, optional = true }
gadk-vertexai = { workspace = true, optional = true }
gadk-server = { workspace = true, optional = true }
gadk-a2a = { workspace = true, optional = true, features = ["server", "client"] }
gadk-launcher = { workspace = true, optional = true }
gadk-telemetry = { workspace = true, optional = true }
gadk-agentregistry = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
pretty_assertions = { workspace = true }
# The MCP tests replay Gemini recordings (gemini_test_model) against in-process MCP servers
# (gadk_mcp::testutil); the mcp example builds its weather server with rmcp's macros.
gadk-engine = { workspace = true, features = ["testutil"] }
gadk-mcp = { workspace = true, features = ["testutil"] }
rmcp = { workspace = true, features = ["server", "macros"] }
# The anthropic runner test replays a Go httprr recording.
gadk-httprr = { workspace = true }
# The openai façade test answers through the scripted fake client (no network).
gadk-model = { workspace = true, features = ["test-util"] }
# The rest_server example and the server façade test serve the router on a loopback socket.
axum = { workspace = true }
# The telemetry example builds its resource; the telemetry façade test exports a span into an
# in-memory exporter through the bridge layer.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

