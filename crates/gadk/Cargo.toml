[package]
name = "gadk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["gemini"]
gemini = ["dep:gadk-gemini"]

[dependencies]
gadk-genai = { workspace = true }
gadk-platform = { workspace = true }
gadk-model = { workspace = true }
gadk-session = { workspace = true }
gadk-gemini = { workspace = true, optional = true }
gadk-artifact = { workspace = true }
gadk-memory = { workspace = true }
gadk-agent = { workspace = true }
gadk-engine = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
pretty_assertions = { workspace = true }

[[example]]
name = "quickstart"
required-features = ["gemini"]

[[example]]
name = "agent_tool"
required-features = ["gemini"]

[[example]]
name = "workflow"

[[example]]
name = "bidi"
required-features = ["gemini"]

[[example]]
name = "bidi_sequential"
required-features = ["gemini"]

[[example]]
name = "bidi_streaming_tool"
required-features = ["gemini"]
