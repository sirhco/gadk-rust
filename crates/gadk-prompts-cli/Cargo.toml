[package]
name = "gadk-prompts-cli"
description = "The gadk-prompts command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lints]
workspace = true

[[bin]]
name = "gadk-prompts"
path = "src/main.rs"
# Not documented: the bin shares its doc output path with the gadk-prompts library.
doc = false

[features]
default = ["firestore"]
firestore = ["dep:gadk-prompts-firestore"]

[dependencies]
gadk-prompts = { workspace = true }
gadk-prompts-firestore = { workspace = true, optional = true }
chrono = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
