[package]
name = "gadk-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# In-process MCP test servers (`gadk_mcp::testutil`) and the `gadk-mcp-stdio-test-server`
# binary. Off by default; the façade's tests turn it on.
testutil = [
  "rmcp/server",
  "rmcp/macros",
  "rmcp/transport-io",
  "rmcp/transport-streamable-http-server",
  "dep:hyper",
  "dep:hyper-util",
  "dep:tower",
]

[dependencies]
gadk-agent = { workspace = true }
gadk-auth = { workspace = true }
gadk-genai = { workspace = true }
gadk-platform = { workspace = true }
rmcp = { workspace = true, features = [
  "client",
  "transport-child-process",
  "transport-async-rw",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
reqwest = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
hyper = { workspace = true, optional = true, features = ["server", "http1"] }
hyper-util = { workspace = true, optional = true, features = ["tokio", "service"] }
tower = { workspace = true, optional = true, features = ["util"] }

[dev-dependencies]
# The `testutil` module also compiles under cfg(test), so `cargo test -p gadk-mcp` needs the
# server side of rmcp and the local HTTP server stack without `--features testutil`.
gadk-session = { workspace = true }
rmcp = { workspace = true, features = [
  "server",
  "macros",
  "transport-io",
  "transport-streamable-http-server",
] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio", "service"] }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["process", "test-util"] }
pretty_assertions = { workspace = true }

[[bin]]
name = "gadk-mcp-stdio-test-server"
path = "src/bin/stdio_test_server.rs"
required-features = ["testutil"]

[[test]]
name = "child_process"
path = "tests/child_process.rs"
required-features = ["testutil"]
