[package]
name = "gadk-vertexai"
description = "Vertex AI Agent Engine session, memory and Example Store services for gadk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
# Test hooks: the `testutil` module's strict replay server (`ReplayServer`) and stateful Agent
# Engine fake (`FakeAgentEngine`), both on gadk-model's 127.0.0.1 fake HTTP server.
testutil = ["gadk-model/test-util", "dep:parking_lot", "dep:url"]

[dependencies]
gadk-session = { workspace = true }
gadk-memory = { workspace = true }
gadk-genai = { workspace = true }
gadk-model = { workspace = true, features = ["gcp-auth"] }
gadk-platform = { workspace = true }
gadk-tools = { workspace = true }
gadk-agent = { workspace = true }
google-cloud-auth = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
gadk-vertexai = { path = ".", features = ["testutil"] }
gadk-session = { workspace = true, features = ["testsuite"] }
gadk-model = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
pretty_assertions = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
