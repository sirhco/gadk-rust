[package]
name = "gadk-server"
description = "The gadk REST API server, with inbound authentication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND BSD-3-Clause"
repository.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
# Test fixtures: `rest::testutil` (a fake session service and the wire scenario). Enabled for this
# crate's own tests by the self dev-dependency.
testutil = ["dep:schemars"]
# The Agent Engine server (`agentengine`); off by default.
agentengine = []

[dependencies]
gadk-agent = { workspace = true }
gadk-engine = { workspace = true }
gadk-session = { workspace = true }
gadk-memory = { workspace = true }
gadk-artifact = { workspace = true }
gadk-genai = { workspace = true }
gadk-model = { workspace = true }
gadk-platform = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
gadk-server = { path = ".", features = ["testutil"] }
gadk-engine = { workspace = true, features = ["testutil"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
pretty_assertions = { workspace = true }
regex = { workspace = true }
