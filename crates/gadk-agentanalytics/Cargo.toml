[package]
name = "gadk-agentanalytics"
description = "BigQuery agent analytics plugin for gadk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
# Test hooks: the in-memory `MockTableOps`, `FakeViewRunner`, `FakeOffloader`, `RecordingLogger`
# and the JSON helpers of `bigquery::fake`, plus gadk-model's fake HTTP server and the tonic
# server (`storagepb` BigQueryWrite server for the in-process fake write server).
testutil = [
    "gadk-model/test-util",
    "tonic/server",
    "tonic/router",
    "dep:hyper-util",
    "dep:tower",
]

[dependencies]
gadk-agent = { workspace = true }
gadk-engine = { workspace = true }
gadk-genai = { workspace = true }
gadk-model = { workspace = true, features = ["gcp-auth"] }
gadk-platform = { workspace = true }
gadk-session = { workspace = true }
google-cloud-auth = { workspace = true }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true, features = ["codegen", "channel", "tls-aws-lc", "tls-native-roots"] }
tonic-prost = { workspace = true }
rand = { workspace = true }
# The plugin's trace manager (7b-3a): synchronous locks, the `traceIDFor` SHA-256 seed, random
# trace / span / event IDs, and the plugin callbacks' boxed futures.
parking_lot = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
# The in-memory duplex connector of `testutil::fake_write_server`.
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
tower = { workspace = true, optional = true, features = ["util"] }

[dev-dependencies]
gadk-agentanalytics = { path = ".", features = ["testutil"] }
# Scripted models and runners for the plugin's runner-level tests (7b-3a).
gadk-engine = { workspace = true, features = ["testutil"] }
gadk-model = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
pretty_assertions = { workspace = true }
