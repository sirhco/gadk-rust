# Recordings for the conformance test "multi_tool".
# Generated by the record plugin; edit with care.
recordings:
  - user_message_index: 0
    agent_name: coordinator
    llm_recording:
      llm_request:
        model: gemini-2.5-pro
        contents:
          - role: user
            parts:
              - text: 'Add 2 and 3, then look up the capital of France.'
        config:
          system_instruction:
            role: user
            parts:
              - text: "You coordinate tools.\nAlways explain your reasoning."
          tools:
            - function_declarations:
                - name: add
                  parameters:
                    type: OBJECT
                    properties:
                      a: {type: INTEGER}
                      b: {type: INTEGER}
                    required: [a, b]
                - name: capital_of
                  parameters_json_schema:
                    type: object
                    properties:
                      country:
                        type: string
                        enum: [France, Spain, "N/A"]
          thinking_config:
            include_thoughts: true
            thinking_budget: -1
      llm_responses:
        - content:
            role: model
            parts:
              - text: I should call add first.
                thought: true
          partial: true
        - content:
            role: model
            parts:
              - function_call:
                  id: call-1
                  name: add
                  args: {a: 2, b: 3}
              - function_call:
                  id: call-2
                  name: capital_of
                  args:
                    country: France
          usage_metadata:
            prompt_token_count: 120
            thoughts_token_count: 15
  - user_message_index: 0
    agent_name: coordinator
    tool_recording:
      tool_call: {id: call-1, name: add, args: {a: 2, b: 3}}
      tool_response:
        id: call-1
        name: add
        response: {result: 5}
  - user_message_index: 0
    agent_name: coordinator
    tool_recording:
      tool_call:
        id: call-2
        name: capital_of
        args:
          country: France
      tool_response:
        id: call-2
        name: capital_of
        response:
          result: Paris
          sources: []
          notes: ~
  # The second user message.
  - user_message_index: 1
    agent_name: coordinator
    llm_recording:
      llm_request:
        model: gemini-2.5-pro
        contents:
          - role: user
            parts:
              - text: >-
                  Summarize everything so far in a single, deliberately long sentence that keeps going well past eighty columns so that line width matters.
      llm_responses:
        - content:
            role: model
            parts:
              - text: "2 + 3 = 5, and the capital of France is Paris — both answers came from tools: add and capital_of."
          finish_reason: STOP
          avg_logprobs: -0.125
