[workspace]
resolver = "3"
members = [
  "crates/gadk-genai",
  "crates/gadk-platform",
  "crates/gadk-model",
  "crates/gadk-gemini",
  "crates/gadk-session",
  "crates/gadk-httprr",
  "crates/gadk-artifact",
  "crates/gadk-artifact-gcs",
  "crates/gadk-memory",
  "crates/gadk-agent",
  "crates/gadk-engine",
  "crates/gadk-tools",
  "crates/gadk-auth",
  "crates/gadk-mcp",
  "crates/gadk-anthropic",
  "crates/gadk-openai",
  "crates/gadk-session-database",
  "crates/gadk-vertexai",
  "crates/gadk-server",
  "crates/gadk-a2a",
  "crates/gadk-launcher",
  "crates/gadk-agentregistry",
  "crates/gadk-telemetry",
  "crates/gadk-cli",
  "crates/gadk-goyaml",
  "crates/gadk-configurable",
  "crates/gadk-agentanalytics",
  "crates/gadk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/sirhco/gadk-rust"

[workspace.dependencies]
gadk-genai = { path = "crates/gadk-genai", version = "0.1.0" }
gadk-platform = { path = "crates/gadk-platform", version = "0.1.0" }
gadk-model = { path = "crates/gadk-model", version = "0.1.0" }
gadk-gemini = { path = "crates/gadk-gemini", version = "0.1.0" }
gadk-session = { path = "crates/gadk-session", version = "0.1.0" }
gadk-httprr = { path = "crates/gadk-httprr", version = "0.1.0" }
gadk-artifact = { path = "crates/gadk-artifact", version = "0.1.0" }
gadk-artifact-gcs = { path = "crates/gadk-artifact-gcs", version = "0.1.0" }
gadk-memory = { path = "crates/gadk-memory", version = "0.1.0" }
gadk-agent = { path = "crates/gadk-agent", version = "0.1.0" }
gadk-engine = { path = "crates/gadk-engine", version = "0.1.0" }
gadk-tools = { path = "crates/gadk-tools", version = "0.1.0" }
gadk-auth = { path = "crates/gadk-auth", version = "0.1.0", default-features = false }
gadk-mcp = { path = "crates/gadk-mcp", version = "0.1.0" }
gadk-anthropic = { path = "crates/gadk-anthropic", version = "0.1.0" }
gadk-openai = { path = "crates/gadk-openai", version = "0.1.0" }
gadk-session-database = { path = "crates/gadk-session-database", version = "0.1.0" }
gadk-vertexai = { path = "crates/gadk-vertexai", version = "0.1.0" }
gadk-server = { path = "crates/gadk-server", version = "0.1.0" }
# default-features off so members can pick `client` / `server` alone (Cargo 1.95 refuses a member-side
# `default-features = false` over a workspace entry that keeps them on).
gadk-a2a = { path = "crates/gadk-a2a", version = "0.1.0", default-features = false }
gadk-launcher = { path = "crates/gadk-launcher", version = "0.1.0" }
gadk-agentregistry = { path = "crates/gadk-agentregistry", version = "0.1.0" }
gadk-telemetry = { path = "crates/gadk-telemetry", version = "0.1.0" }
gadk-cli = { path = "crates/gadk-cli", version = "0.1.0" }
gadk-goyaml = { path = "crates/gadk-goyaml", version = "0.1.0" }
gadk-configurable = { path = "crates/gadk-configurable", version = "0.1.0" }
gadk-agentanalytics = { path = "crates/gadk-agentanalytics", version = "0.1.0" }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7.20"
futures = "0.3.34"
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "http2", "rustls", "charset", "system-proxy"] }
reqwest-middleware = { version = "0.5.2", default-features = false, features = ["json"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "raw_value"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["serialize", "deserialize"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
bytes = { version = "1.12.1", features = ["serde"] }
base64 = "0.23.1"
http = "1.5.0"
url = "2.5.8"
regex = "1.13.1"
regex-syntax = "0.8.11"
parking_lot = "0.13.0"
sha2 = "0.11.1"
google-cloud-auth = "1.18.0"
rstest = "0.28.0"
insta = { version = "1.49.0", features = ["json"] }
pretty_assertions = "1.4.1"
anyhow = "1.0.104"
tracing-subscriber = "0.3.23"
schemars = "1.2.3"
jsonschema = { version = "0.60.2", default-features = false }
async-stream = "0.3.6"
unicode-properties = "0.1.5"
unicode-normalization = "0.1.26"
unicode_names2 = "4.0.0"
rmcp = { version = "3.9.0", default-features = false }
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
tower = { version = "0.5.3", default-features = false }
rand = "0.10.3"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "chrono"] }
tempfile = "3.27.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws", "matched-path"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic"] }
a2a-lf = { version = "=0.4.2", default-features = false }
a2a-client-lf = { version = "=0.2.9", default-features = false, features = ["rustls-tls"] }
a2a-server-lf = { version = "=0.5.3", default-features = false, features = ["rustls-tls"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "logs", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "logs", "metrics", "experimental_metrics_custom_reader"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace", "logs", "metrics"] }
opentelemetry-http = { version = "0.33.1", default-features = false }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics"] }
prost = "0.14.5"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
tar = "0.4.46"
flate2 = "1.1.11"
# 7b-1: Arrow schema + IPC stream encoding for gadk-agentanalytics (newest arrow-rs with MSRV <= 1.95).
arrow-schema = { version = "=60.1", default-features = false }
arrow-array = { version = "=60.1", default-features = false }
arrow-ipc = { version = "=60.1", default-features = false }
# 7b-2: gRPC client (and, under gadk-agentanalytics' `testutil`, server) for the generated
# BigQuery Storage Write `storagepb` (scripts/gen-storagepb); same versions as a2a-pb's.
tonic = { version = "=0.14.9", default-features = false }
tonic-prost = { version = "=0.14.9", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
